<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAC Stationery & Gifts - B2B Wholesale Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header / Navbar -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-2 rounded-lg text-white">
          <i class="fa-solid fa-store text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">RAC Stationery & Gifts</h1>
          <p class="text-xs text-slate-400">Dindigul Wholesale Catalog</p>
        </div>
      </div>

      <!-- Search & Cart trigger -->
      <div class="flex items-center space-x-3">
        <button onclick="toggleCart()" class="relative bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg flex items-center space-x-2 transition">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="hidden sm:inline font-medium">Quote List</span>
          <span id="cart-count" class="bg-white text-indigo-900 font-bold rounded-full h-5 w-5 flex items-center justify-center text-xs">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    <!-- Controls Bar -->
    <div class="flex flex-col md:flex-row gap-4 mb-6 justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <!-- Search Input -->
      <div class="relative w-full md:w-96">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="Search items, categories..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>

      <!-- Category Filter -->
      <div class="flex items-center space-x-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0" id="category-filters">
        <button onclick="selectCategory('All')" class="cat-btn active bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap">All Items</button>
      </div>
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div class="col-span-full text-center py-12 text-slate-500">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-indigo-600"></i>
        <p>Loading products from catalog...</p>
      </div>
    </div>
  </main>

  <!-- Cart Modal / Slide-over -->
  <div id="cart-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
      <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
        <h2 class="font-bold text-lg flex items-center gap-2">
          <i class="fa-solid fa-list-check"></i> Requisition Quote
        </h2>
        <button onclick="toggleCart()" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>

      <div id="cart-items" class="flex-grow overflow-y-auto p-4 space-y-3">
        <!-- Dynamic Cart Items -->
      </div>

      <div class="p-4 border-t border-slate-200 bg-slate-50 space-y-3">
        <div class="flex justify-between font-bold text-slate-800 text-base">
          <span>Est. Total Amount:</span>
          <span id="cart-total">₹0</span>
        </div>

        <form id="quote-form" onsubmit="event.preventDefault(); sendEmailOrder();" class="space-y-2">
          <input type="text" id="cust-name" placeholder="Business / Customer Name *" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <input type="email" id="cust-email" placeholder="Email Address *" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <input type="tel" id="cust-phone" placeholder="Phone / WhatsApp Number *" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          
          <button type="submit" id="email-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> Submit Quote Request
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Configuration Constants
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7eeDOGHSz1B-iPX-HL9Sm7y-r0TQJF3IRpqUXNA5ueNYE4efdqLbwZdnZ0VU8Z9H8pw75FGJsaYkA/pub?output=csv";
    const WEB3FORMS_KEY = "85076d55-e45c-45e8-a6cd-bc9907e74e26";

    let products = [];
    let cart = [];
    let selectedCategory = "All";

    // Initialize Page
    document.addEventListener("DOMContentLoaded", () => {
      fetchProducts();
    });

    async function fetchProducts() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        const csvText = await response.text();
        
        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: (results) => {
            products = results.data.map((item, index) => ({
              id: index + 1,
              name: item["Item Name"] || item["Name"] || "Unnamed Product",
              category: item["Category"] || "General",
              price: parseFloat(item["Price"] || item["Wholesale Price"] || 0),
              unit: item["Unit"] || "Piece",
              image: item["Image URL"] || "https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?w=300&auto=format&fit=crop&q=60"
            }));
            renderCategories();
            renderProducts();
          }
        });
      } catch (err) {
        document.getElementById('product-grid').innerHTML = `
          <div class="col-span-full text-center py-12 text-rose-500">
            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
            <p>Failed to load product catalog. Please verify Google Sheet permissions.</p>
          </div>
        `;
      }
    }

    function renderCategories() {
      const categories = ["All", ...new Set(products.map(p => p.category))];
      const container = document.getElementById('category-filters');
      container.innerHTML = categories.map(cat => `
        <button onclick="selectCategory('${cat}')" class="cat-btn ${cat === selectedCategory ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'} px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition">
          ${cat}
        </button>
      `).join('');
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      filterProducts();
    }

    function filterProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = products.filter(p => {
        const matchesCategory = selectedCategory === "All" || p.category === selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });
      renderProducts(filtered);
    }

    function renderProducts(itemsToRender = products) {
      const grid = document.getElementById('product-grid');
      if (itemsToRender.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">No items match your search.</div>`;
        return;
      }

      grid.innerHTML = itemsToRender.map(p => `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
          <div class="p-4">
            <span class="badge bg-slate-100 text-slate-600 uppercase font-bold tracking-wider">${p.category}</span>
            <h3 class="font-bold text-slate-800 text-base mt-2">${p.name}</h3>
            <p class="text-sm font-semibold text-indigo-600 mt-1">₹${p.price} <span class="text-xs text-slate-400 font-normal">/ ${p.unit}</span></p>
          </div>
          <div class="p-4 pt-0">
            <button onclick="addToCart(${p.id})" class="w-full bg-slate-900 hover:bg-indigo-600 text-white font-medium py-2 rounded-lg text-sm transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-plus text-xs"></i> Add to Quote
            </button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existing = cart.find(item => item.id === productId);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      updateCartUI();
    }

    function updateCartUI() {
      const countEl = document.getElementById('cart-count');
      const itemsEl = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');

      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      countEl.innerText = totalItems;
      totalEl.innerText = `₹${totalPrice}`;

      if (cart.length === 0) {
        itemsEl.innerHTML = `<p class="text-center text-slate-400 text-sm py-8">Your quote list is empty.</p>`;
        return;
      }

      itemsEl.innerHTML = cart.map(item => `
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <div>
            <h4 class="font-semibold text-slate-800 text-sm">${item.name}</h4>
            <p class="text-xs text-slate-500">₹${item.price} x ${item.quantity} ${item.unit}(s)</p>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-slate-200 rounded flex items-center justify-center text-slate-700 hover:bg-slate-300">-</button>
            <span class="text-sm font-bold w-4 text-center">${item.quantity}</span>
            <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-slate-200 rounded flex items-center justify-center text-slate-700 hover:bg-slate-300">+</button>
          </div>
        </div>
      `).join('');
    }

    function changeQty(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) {
          cart = cart.filter(i => i.id !== productId);
        }
      }
      updateCartUI();
    }

    function toggleCart() {
      document.getElementById('cart-modal').classList.toggle('hidden');
    }

    async function sendEmailOrder() {
      const name = document.getElementById('cust-name').value.trim();
      const email = document.getElementById('cust-email').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const btn = document.getElementById('email-submit-btn');

      if (cart.length === 0) {
        alert("Please add items to your quote list first.");
        return;
      }

      // Generate HTML table rows for cart items
      let tableRows = cart.map((i, index) => `
        <tr style="border-bottom: 1px solid #e2e8f0;">
          <td style="padding: 10px; text-align: center; color: #64748b;">${index + 1}</td>
          <td style="padding: 10px; font-weight: bold; color: #1e293b;">${i.name}</td>
          <td style="padding: 10px; text-align: center;">${i.quantity} ${i.unit}(s)</td>
          <td style="padding: 10px; text-align: right;">₹${i.price}</td>
          <td style="padding: 10px; text-align: right; font-weight: bold;">₹${i.price * i.quantity}</td>
        </tr>
      `).join('');

      let total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      // Construct HTML email template
      const htmlTemplate = `
        <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden;">
          <div style="background-color: #0f172a; color: #ffffff; padding: 20px; text-align: center;">
            <h2 style="margin: 0; font-size: 20px;">RAC Stationery & Gifts</h2>
            <p style="margin: 5px 0 0; font-size: 13px; color: #94a3b8;">B2B Bulk Order Requisition</p>
          </div>

          <div style="padding: 20px; background-color: #f8fafc;">
            <h3 style="margin-top: 0; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;">Customer Information</h3>
            <p style="margin: 6px 0; font-size: 14px;"><strong>Customer Name:</strong> ${name}</p>
            <p style="margin: 6px 0; font-size: 14px;"><strong>Phone / WhatsApp:</strong> ${phone}</p>
            <p style="margin: 6px 0; font-size: 14px;"><strong>Email Address:</strong> ${email}</p>
          </div>

          <div style="padding: 20px;">
            <h3 style="margin-top: 0; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;">Order Summary</h3>
            <table style="width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px;">
              <thead>
                <tr style="background-color: #f1f5f9; text-align: left;">
                  <th style="padding: 10px; text-align: center;">#</th>
                  <th style="padding: 10px;">Item Description</th>
                  <th style="padding: 10px; text-align: center;">Qty</th>
                  <th style="padding: 10px; text-align: right;">Unit Price</th>
                  <th style="padding: 10px; text-align: right;">Subtotal</th>
                </tr>
              </thead>
              <tbody>
                ${tableRows}
              </tbody>
            </table>

            <div style="margin-top: 20px; text-align: right; font-size: 16px; font-weight: bold; color: #0f172a; background-color: #f1f5f9; padding: 12px; border-radius: 6px;">
              Estimated Total: <span style="color: #059669;">₹${total}</span>
            </div>
          </div>
        </div>
      `;

      btn.disabled = true;
      btn.innerText = "Submitting Quote Request...";

      try {
        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            access_key: WEB3FORMS_KEY,
            subject: `[RAC B2B Quote] Order from ${name}`,
            from_name: "RAC Stationery Web Catalog",
            name: name,
            email: email,
            phone: phone,
            message: htmlTemplate
          })
        });

        const result = await response.json();
        if (result.success) {
          alert("Quote submitted successfully! RAC Stationery team will contact you shortly.");
          cart = [];
          updateCartUI();
          toggleCart();
        } else {
          alert("Failed to submit quote. Please contact via phone or WhatsApp.");
        }
      } catch (err) {
        alert("Error sending quote. Please try again.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Submit Quote Request";
      }
    }
  </script>
</body>
</html>
