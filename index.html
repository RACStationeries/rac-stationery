<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAC Stationery & Gifts - Dindigul</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-blue-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-wide">RAC Stationery & Gifts</h1>
        <p class="text-xs text-blue-200">Dindigul (624004) • B2B & Bulk Orders</p>
      </div>
      <button onclick="toggleCart()" class="relative bg-blue-800 hover:bg-blue-700 p-2.5 rounded-lg flex items-center gap-2 transition">
        <i data-lucide="shopping-cart" class="w-5 h-5"></i>
        <span class="hidden sm:inline text-sm font-medium">Quote List</span>
        <span id="cart-count" class="bg-emerald-500 text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
      </button>
    </div>
  </header>

  <!-- Contact Bar -->
  <section class="bg-blue-800 text-blue-100 py-3 border-t border-blue-700 text-xs sm:text-sm">
    <div class="max-w-7xl mx-auto px-4 flex flex-wrap justify-between items-center gap-2">
      <div class="flex items-center gap-4">
        <span class="flex items-center gap-1"><i data-lucide="phone" class="w-4 h-4"></i> 79040 89224 / 84284 89224</span>
        <span class="hidden md:flex items-center gap-1"><i data-lucide="mail" class="w-4 h-4"></i> racstationeryshop@gmail.com</span>
      </div>
      <div class="flex items-center gap-1">
        <i data-lucide="map-pin" class="w-4 h-4"></i> Dindigul - 624004
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-center">
      <div class="relative w-full md:w-96">
        <input type="text" id="search-input" oninput="renderProducts()" placeholder="Search stationery, paper, pens..." class="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>
      <button onclick="loadProductsFromSheet()" class="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-2 rounded-lg flex items-center gap-1 text-slate-700">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh Catalog
      </button>
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12 text-slate-500">Loading catalog from Google Sheets...</div>
    </div>
  </main>

  <!-- Cart Modal -->
  <div id="cart-modal" class="fixed inset-0 z-50 bg-black/50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col shadow-xl">
      <div class="p-4 bg-blue-900 text-white flex justify-between items-center">
        <h2 class="font-bold text-lg flex items-center gap-2">
          <i data-lucide="shopping-cart" class="w-5 h-5"></i> Bulk Order Quote
        </h2>
        <button onclick="toggleCart()" class="text-blue-200 hover:text-white text-xl">✕</button>
      </div>

      <!-- Items List -->
      <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

      <!-- Footer / Dynamic Device Order Form -->
      <div id="cart-footer" class="p-4 border-t bg-slate-50 space-y-3 hidden">
        <div class="flex justify-between font-bold text-slate-900 text-lg border-b pb-2">
          <span>Estimated Total:</span>
          <span id="cart-total">₹0</span>
        </div>

        <!-- WhatsApp Container (Default on Mobile) -->
        <div id="whatsapp-container" class="space-y-2">
          <button onclick="sendWhatsAppOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-bold flex items-center justify-center gap-2 transition shadow">
            <i data-lucide="send" class="w-5 h-5"></i> Send Quote via WhatsApp
          </button>
          <div class="text-center">
            <button onclick="switchMode('email')" class="text-xs text-blue-700 underline font-medium">
              Send Quote Request via Email Form Instead
            </button>
          </div>
        </div>

        <!-- Email Form Container (Default on Desktop) -->
        <div id="email-container" class="space-y-2.5 hidden">
          <p class="text-xs text-slate-600 font-medium">Enter details to submit quote directly to RAC Stationery:</p>
          <input type="text" id="cust-name" placeholder="Full Name / Company Name *" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
          <input type="email" id="cust-email" placeholder="Email Address *" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
          <input type="tel" id="cust-phone" placeholder="Phone / WhatsApp Number *" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
          
          <button onclick="sendEmailOrder()" id="email-submit-btn" class="w-full bg-blue-900 hover:bg-blue-800 text-white py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 transition shadow">
            <i data-lucide="mail" class="w-4 h-4"></i> Submit Quote Request
          </button>
          <div class="text-center">
            <button onclick="switchMode('whatsapp')" class="text-xs text-emerald-700 underline font-medium">
              Prefer Sending via WhatsApp App?
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Paste your published Google Sheets CSV Link below:
    const SHEET_CSV_URL = "PASTE_YOUR_GOOGLE_SHEET_CSV_URL_HERE";

    // Direct Email Form API Access Key (Web3Forms Key)
    const WEB3FORMS_KEY = "YOUR_WEB3FORMS_ACCESS_KEY";

    let PRODUCTS = [];
    let cart = [];

    // Mobile vs Desktop Detection
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    async function loadProductsFromSheet() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500">Updating catalog...</div>';

      try {
        const response = await fetch(SHEET_CSV_URL);
        const text = await response.text();
        const rows = text.split(/\r?\n/).slice(1);

        PRODUCTS = rows.filter(r => r.trim()).map((row, index) => {
          const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || row.split(',');
          const cleanCols = cols.map(c => c.replace(/^"|"$/g, '').trim());

          return {
            id: parseInt(cleanCols[0]) || index + 1,
            name: cleanCols[1] || 'Stationery Item',
            price: parseFloat(cleanCols[2]) || 0,
            unit: cleanCols[3] || 'Piece',
            image: cleanCols[4] || 'https://images.unsplash.com/photo-1586075010923-2dd4570fb338?w=400'
          };
        });

        renderProducts();
      } catch (err) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-red-500">Failed to load catalog. Please verify your Google Sheet.</div>';
        console.error(err);
      }
    }

    function renderProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';

      const filtered = PRODUCTS.filter(p => p.name.toLowerCase().includes(query));

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500">No matching items found.</div>';
        return;
      }

      filtered.forEach(p => {
        grid.innerHTML += `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between">
            <img src="${p.image}" class="h-48 w-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1586075010923-2dd4570fb338?w=400'">
            <div class="p-4 flex-1 flex flex-col justify-between">
              <h3 class="font-semibold text-slate-900">${p.name}</h3>
              <div class="mt-4 flex items-center justify-between">
                <span class="font-bold text-slate-900">₹${p.price} / ${p.unit}</span>
                <button onclick="addToCart(${p.id})" class="bg-blue-900 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-blue-800">Add</button>
              </div>
            </div>
          </div>
        `;
      });
      lucide.createIcons();
    }

    function addToCart(id) {
      const existing = cart.find(item => item.id === id);
      if (existing) existing.quantity++;
      else cart.push({ ...PRODUCTS.find(p => p.id === id), quantity: 1 });
      updateCartUI();
    }

    function toggleCart() {
      document.getElementById('cart-modal').classList.toggle('hidden');
    }

    function switchMode(mode) {
      const wa = document.getElementById('whatsapp-container');
      const email = document.getElementById('email-container');
      if (mode === 'email') {
        wa.classList.add('hidden');
        email.classList.remove('hidden');
      } else {
        email.classList.add('hidden');
        wa.classList.remove('hidden');
      }
    }

    function updateCartUI() {
      const countEl = document.getElementById('cart-count');
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      countEl.innerText = totalCount;
      countEl.classList.toggle('hidden', totalCount === 0);

      const itemsEl = document.getElementById('cart-items');
      itemsEl.innerHTML = cart.length === 0 ? '<p class="text-slate-500 text-center py-8">Your quote list is empty.</p>' : '';
      
      let totalPrice = 0;
      cart.forEach(item => {
        totalPrice += item.price * item.quantity;
        itemsEl.innerHTML += `
          <div class="flex justify-between items-center border-b pb-2">
            <div>
              <p class="font-medium text-sm">${item.name}</p>
              <p class="text-xs text-slate-500">₹${item.price} x ${item.quantity}</p>
            </div>
            <p class="font-bold text-sm">₹${item.price * item.quantity}</p>
          </div>
        `;
      });

      document.getElementById('cart-total').innerText = '₹' + totalPrice;
      document.getElementById('cart-footer').classList.toggle('hidden', cart.length === 0);

      // Default mode based on device
      if (isMobile) {
        switchMode('whatsapp');
      } else {
        switchMode('email');
      }

      lucide.createIcons();
    }

    function sendWhatsAppOrder() {
      let msg = "*Bulk Order Inquiry - RAC Stationery & Gifts*\n\n";
      let total = 0;
      cart.forEach(item => {
        msg += `• ${item.name} - ${item.quantity} ${item.unit}(s) = ₹${item.price * item.quantity}\n`;
        total += item.price * item.quantity;
      });
      msg += `\n*Total Estimate:* ₹${total}\nLocation: Dindigul`;
      window.open(`https://wa.me/917904089224?text=${encodeURIComponent(msg)}`, '_blank');
    }

    async function sendEmailOrder() {
      const name = document.getElementById('cust-name').value.trim();
      const email = document.getElementById('cust-email').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const btn = document.getElementById('email-submit-btn');

      if (!name || !email || !phone) {
        alert("Please fill in your name, email, and phone number.");
        return;
      }

      let orderSummary = cart.map(i => `${i.name} x ${i.quantity} ${i.unit}(s) = ₹${i.price * i.quantity}`).join("\n");
      let total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      btn.disabled = true;
      btn.innerText = "Submitting Quote Request...";

      try {
        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            access_key: WEB3FORMS_KEY,
            subject: `New B2B Quote Request - ${name}`,
            from_name: "RAC Stationery Storefront",
            name: name,
            email: email,
            phone: phone,
            message: `Customer Name: ${name}\nEmail: ${email}\nPhone: ${phone}\n\nQuote Items:\n${orderSummary}\n\nTotal Estimated Amount: ₹${total}`
          })
        });

        const result = await response.json();
        if (result.success) {
          alert("Quote submitted successfully! RAC Stationery team will contact you shortly.");
          cart = [];
          updateCartUI();
          toggleCart();
        } else {
          alert("Failed to submit quote. Please contact via phone or WhatsApp.");
        }
      } catch (err) {
        alert("Error sending quote. Please try again.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Submit Quote Request";
      }
    }

    loadProductsFromSheet();
  </script>
</body>
</html>
